# tmux-agent-picker: pi agent popup and focus-driven done -> idle state.
source-file ~/Documents/personal/tmux-agent-picker/theme/catppuccin-mocha.tmux.conf
set -g focus-events on

bind a run-shell "tmux display-popup -s '#{@ap_popup_style}' -S '#{@ap_popup_border_style}' -b rounded -c '#{client_name}' -E -w 80% -h 80% \"/Users/justinlam/Documents/personal/tmux-agent-picker/bin/agent-pick --client '#{client_name}'\"; rc=\$?; if [ \$rc -ne 0 ] && [ \$rc -ne 130 ]; then tmux display-message 'agent-picker: popup failed'; fi"

set-hook -g 'pane-focus-in[77]' "run-shell -b '/Users/justinlam/Documents/personal/tmux-agent-picker/bin/agent-state seen \"#{?hook_pane,#{hook_pane},#{pane_id}}\" >/dev/null 2>&1 || true'"
set-hook -g 'after-select-pane[77]' "run-shell -b '/Users/justinlam/Documents/personal/tmux-agent-picker/bin/agent-state seen \"#{?hook_pane,#{hook_pane},#{pane_id}}\" >/dev/null 2>&1 || true'"
set-hook -g 'after-select-window[77]' "run-shell -b '/Users/justinlam/Documents/personal/tmux-agent-picker/bin/agent-state seen \"#{?hook_pane,#{hook_pane},#{pane_id}}\" >/dev/null 2>&1 || true'"
set-hook -g 'client-session-changed[77]' "run-shell -b '/Users/justinlam/Documents/personal/tmux-agent-picker/bin/agent-state seen \"#{?hook_pane,#{hook_pane},#{pane_id}}\" >/dev/null 2>&1 || true'"
