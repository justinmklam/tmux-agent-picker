# Agent picker theme: Catppuccin Mocha.
# @ap_fzf_colors uses fzf's --color syntax.
# @ap_session_colors is an ordered truecolour palette; popup options use tmux style syntax.
set -g @ap_fzf_colors 'bg:#1e1e2e,bg+:#313244,fg:#cdd6f4,fg+:#f5e0e6,hl:#f38ba8,hl+:#f38ba8,pointer:#f38ba8,marker:#a6e3a1,info:#89b4fa,prompt:#89b4fa,spinner:#89b4fa,header:#a6adc8,border:#585b70,query:#cdd6f4,preview-bg:#1e1e2e,preview-border:#585b70'
set -g @ap_session_colors '#f5c2e7 #fab387 #f9e2af #a6e3a1 #94e2d5 #89dceb #89b4fa #cba6f7'
set -g @ap_popup_style 'bg=#1e1e2e,fg=#cdd6f4'
set -g @ap_popup_border_style 'bg=#1e1e2e,fg=#585b70'
